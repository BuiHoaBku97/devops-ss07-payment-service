spring:
    application:
        name: payment-service

    datasource:
        driver-class-name: org.postgresql.Driver
        url: ${CORE_DB_URL}
        username: ${CORE_DB_USERNAME}
        password: ${CORE_DB_PW}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    port: ${PAYMENT_SERVICE_PORT:8080}